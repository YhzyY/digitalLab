<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>阶段三 · 智能态势感知</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">
  <div id="header-host"></div>
  <div class="main">
    <div class="viewport" id="viewport">
      <div class="overlay-tip">
        <b>智能态势感知</b> · 依次完成火警、交通拥堵与道路积水三项研判任务
      </div>
      <div class="legend">
        <span><i style="background:#ff4d6d"></i>告警</span>
        <span><i style="background:#ffb800"></i>关注</span>
        <span><i style="background:#00d4ff"></i>正常</span>
      </div>
    </div>
    <aside class="sidebar">
      <div class="sb-head">
        <div class="sb-title">阶段三 · 智能态势感知</div>
      </div>
      <div class="sb-body">
        <div class="block">
          <div class="block-title">任务进度</div>
          <div class="obj-list" id="taskList"></div>
        </div>

        <!-- 任务 A：建筑火警 -->
        <div class="block" id="blockFire">
          <div class="block-title">A · 建筑火警研判</div>
          <div class="hint">综合烟感、温感与视频置信度，超阈值即触发告警。可勾选参与研判的数据源。</div>
          <div id="fireSources"></div>
          <div class="field">
            <label>烟感阈值 (ppm) <span class="val" id="vSmoke">300</span></label>
            <input type="range" id="rSmoke" min="100" max="800" step="50" value="300">
          </div>
          <div class="field">
            <label>温感阈值 (℃) <span class="val" id="vTemp">60</span></label>
            <input type="range" id="rTemp" min="30" max="120" step="5" value="60">
          </div>
          <button class="btn btn-primary btn-sm" id="btnFire" style="width:100%">执行火警研判</button>
        </div>

        <!-- 任务 B：交通拥堵 -->
        <div class="block" id="blockTraffic">
          <div class="block-title">B · 交通拥堵研判</div>
          <div class="hint">调用阶段二融合结果，按车速阈值判定拥堵等级。</div>
          <div class="field">
            <label>拥堵车速阈值 (km/h) <span class="val" id="vSpeed">20</span></label>
            <input type="range" id="rSpeed" min="10" max="40" step="1" value="20">
          </div>
          <button class="btn btn-primary btn-sm" id="btnTraffic" style="width:100%">执行拥堵研判</button>
        </div>

        <!-- 任务 C：道路积水 -->
        <div class="block" id="blockFlood">
          <div class="block-title">C · 道路积水研判</div>
          <div class="hint">将水位观测关联至低洼路段，按阈值分级；缺测时保留「未知」状态，不臆测。</div>
          <div class="field">
            <label>警告水位 (cm) <span class="val" id="vWarn">15</span></label>
            <input type="range" id="rWarn" min="5" max="40" step="1" value="15">
          </div>
          <div class="field">
            <label>危险水位 (cm) <span class="val" id="vDanger">30</span></label>
            <input type="range" id="rDanger" min="20" max="80" step="1" value="30">
          </div>
          <button class="btn btn-primary btn-sm" id="btnFlood" style="width:100%">执行积水研判</button>
        </div>

        <div class="block" id="resultBlock" style="display:none">
          <div class="block-title">研判结果</div>
          <div id="resultBody"></div>
        </div>
      </div>
      <div class="sb-foot">
        <button class="btn btn-ghost" id="btnBack">← 上一步</button>
        <button class="btn btn-primary" id="btnNext" disabled>生成实验报告 →</button>
      </div>
    </aside>
  </div>
  <div class="statusbar">
    <span class="live">SITUATION ENGINE RUNNING</span>
    <span id="statText">三项研判任务待执行</span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="assets/common.js"></script>
<script>
renderHeader(3);

const state = DC.load();
const city = createDigitalCity(document.getElementById('viewport'), { mode: 'city' });

/* 建筑观测数据（固定种子） */
const FIRE_OBS = [
  { id: 'BLD-01', smoke: 120, temp: 28, video: 0.05 },
  { id: 'BLD-03', smoke: 480, temp: 72, video: 0.91 },
  { id: 'BLD-05', smoke: 210, temp: 34, video: 0.12 },
  { id: 'BLD-08', smoke: 340, temp: 66, video: 0.78 },
  { id: 'BLD-12', smoke: 90,  temp: 25, video: 0.02 }
];

/* 道路积水观测 */
const FLOOD_OBS = {
  'EW-02': 18,
  'NS-02': 6,
  'EW-01': 2,
  'NS-01': null   /* 缺测 */
};

let fireSources = ['smoke', 'temp'];

/* 渲染火警数据源 */
function renderFireSources(){
  const list = [
    { id: 'smoke', name: '烟感观测' },
    { id: 'temp', name: '温感观测' },
    { id: 'video', name: '视频置信度' }
  ];
  document.getElementById('fireSources').innerHTML = list.map(s => `
    <div class="checkcard ${fireSources.includes(s.id) ? 'on' : ''}" data-id="${s.id}">
      <div class="sw">✓</div><div>${s.name}</div>
    </div>
  `).join('');
  document.querySelectorAll('#fireSources .checkcard').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.id;
      if(fireSources.includes(id)) fireSources = fireSources.filter(x => x !== id);
      else fireSources.push(id);
      if(!fireSources.length) fireSources = ['smoke'];
      renderFireSources();
    });
  });
}
renderFireSources();

/* 任务状态 */
function taskState(){
  const s = state.situation;
  return [
    { key: 'fire', name: '建筑火警研判', done: !!s.fire },
    { key: 'traffic', name: '交通拥堵研判', done: !!s.traffic },
    { key: 'flood', name: '道路积水研判', done: !!s.flood }
  ];
}
function renderTasks(){
  document.getElementById('taskList').innerHTML = taskState().map(t => `
    <div class="obj-item">
      <span class="dot" style="background:${t.done ? '#00ffa3' : '#4a6478'};box-shadow:${t.done ? '0 0 8px #00ffa3' : 'none'}"></span>
      <span class="name">${t.name}</span>
      <span class="tag">${t.done ? '已完成' : '待执行'}</span>
    </div>`).join('');
  const all = taskState().every(t => t.done);
  document.getElementById('btnNext').disabled = !all;
  document.getElementById('statText').textContent =
    `${taskState().filter(t => t.done).length}/3 项研判任务已完成`;
}
renderTasks();

/* 显示结果 */
function showResult(html){
  document.getElementById('resultBody').innerHTML = html;
  document.getElementById('resultBlock').style.display = 'block';
}

/* ---------- 任务 A：火警 ---------- */
document.getElementById('rSmoke').addEventListener('input', e => document.getElementById('vSmoke').textContent = e.target.value);
document.getElementById('rTemp').addEventListener('input', e => document.getElementById('vTemp').textContent = e.target.value);

document.getElementById('btnFire').addEventListener('click', () => {
  const smokeT = +document.getElementById('rSmoke').value;
  const tempT = +document.getElementById('rTemp').value;

  const results = FIRE_OBS.map(o => {
    let score = 0;
    if(fireSources.includes('smoke') && o.smoke >= smokeT) score++;
    if(fireSources.includes('temp') && o.temp >= tempT) score++;
    if(fireSources.includes('video') && o.video >= 0.7) score++;
    const alarm = score >= Math.max(2, Math.ceil(fireSources.length * 0.6));
    return { ...o, score, alarm };
  });

  results.forEach(r => {
    city.setBuildingState(r.id, r.alarm ? C.red : null, r.alarm ? 1.6 : 0);
  });

  const rows = results.map(r => `
    <tr>
      <td>${r.id}</td>
      <td>${r.smoke}</td>
      <td>${r.temp}</td>
      <td>${(r.video * 100).toFixed(0)}%</td>
      <td>${r.score}/${fireSources.length}</td>
      <td>${r.alarm ? '<span class="bad">告警</span>' : '<span class="ok">正常</span>'}</td>
    </tr>`).join('');

  showResult(`<table class="dtable">
    <thead><tr><th>建筑</th><th>烟感</th><th>温感</th><th>视频</th><th>命中</th><th>结论</th></tr></thead>
    <tbody>${rows}</tbody></table>`);

  state.situation.fire = {
    sources: fireSources.slice(),
    smokeT, tempT,
    alarms: results.filter(r => r.alarm).map(r => r.id),
    at: new Date().toLocaleTimeString('zh-CN', { hour12: false })
  };
  DC.save(state);
  DC.addEvidence(3, '火警研判',
    `数据源 [${fireSources.join(',')}] · 烟感≥${smokeT}ppm 温感≥${tempT}℃ · 告警建筑 [${state.situation.fire.alarms.join(',') || '无'}]`);
  DC.toast('火警研判完成：' + (state.situation.fire.alarms.length || 0) + ' 处告警', 'ok');
  renderTasks();
});

/* ---------- 任务 B：交通拥堵 ---------- */
document.getElementById('rSpeed').addEventListener('input', e => document.getElementById('vSpeed').textContent = e.target.value);

document.getElementById('btnTraffic').addEventListener('click', () => {
  const speedT = +document.getElementById('rSpeed').value;
  const fusion = state.fusion.results || [];
  if(!fusion.length){
    DC.toast('请先在阶段二完成数据融合', 'warn');
    return;
  }

  const results = fusion.map(r => {
    let level = 'ok';
    if(r.speed === null) level = 'unknown';
    else if(r.speed < speedT) level = 'congested';
    else if(r.speed < speedT * 1.5) level = 'slow';
    return { ...r, level };
  });

  results.forEach(r => {
    const color = r.level === 'congested' ? C.red
                : r.level === 'slow' ? C.amber
                : r.level === 'unknown' ? 0x334455
                : C.cyan;
    city.setRoadState(r.rid, color, r.level === 'congested' ? 1.4 : 0.8);
  });

  const rows = results.map(r => {
    const st = r.level === 'congested' ? '<span class="bad">拥堵</span>'
             : r.level === 'slow' ? '<span class="warn">缓行</span>'
             : r.level === 'unknown' ? '<span style="color:#4a6478">未知</span>'
             : '<span class="ok">畅通</span>';
    return `<tr>
      <td>${r.rid}</td>
      <td>${r.speed ?? '—'}</td>
      <td>${r.flow ?? '—'}</td>
      <td>Q${r.quality}</td>
      <td>${st}</td>
    </tr>`;
  }).join('');

  showResult(`<table class="dtable">
    <thead><tr><th>路段</th><th>车速</th><th>流量</th><th>质量</th><th>等级</th></tr></thead>
    <tbody>${rows}</tbody></table>`);

  const congested = results.filter(r => r.level === 'congested').map(r => r.rid);
  state.situation.traffic = {
    speedT, congested,
    level: results.map(r => ({ rid: r.rid, level: r.level })),
    at: new Date().toLocaleTimeString('zh-CN', { hour12: false })
  };
  DC.save(state);
  DC.addEvidence(3, '拥堵研判',
    `拥堵车速阈值 ${speedT}km/h · 拥堵路段 [${congested.join(',') || '无'}]`);
  DC.toast('拥堵研判完成：' + (congested.length || 0) + ' 条路段拥堵', 'ok');
  renderTasks();
});

/* ---------- 任务 C：道路积水 ---------- */
document.getElementById('rWarn').addEventListener('input', e => document.getElementById('vWarn').textContent = e.target.value);
document.getElementById('rDanger').addEventListener('input', e => document.getElementById('vDanger').textContent = e.target.value);

document.getElementById('btnFlood').addEventListener('click', () => {
  const warnT = +document.getElementById('rWarn').value;
  const dangerT = +document.getElementById('rDanger').value;
  if(dangerT <= warnT){ DC.toast('危险水位须高于警告水位', 'warn'); return; }

  const results = Object.keys(FLOOD_OBS).map(rid => {
    const v = FLOOD_OBS[rid];
    let level;
    if(v === null) level = 'unknown';
    else if(v >= dangerT) level = 'danger';
    else if(v >= warnT) level = 'warn';
    else level = 'ok';
    return { rid, v, level };
  });

  results.forEach(r => {
    const color = r.level === 'danger' ? C.red
                : r.level === 'warn' ? C.amber
                : r.level === 'unknown' ? 0x334455
                : C.cyan;
    city.setRoadState(r.rid, color, r.level === 'danger' ? 1.6 : 0.9);
  });

  const rows = results.map(r => {
    const st = r.level === 'danger' ? '<span class="bad">危险</span>'
             : r.level === 'warn' ? '<span class="warn">警告</span>'
             : r.level === 'unknown' ? '<span style="color:#4a6478">未知（缺测）</span>'
             : '<span class="ok">正常</span>';
    return `<tr>
      <td>${r.rid}</td>
      <td>${r.v === null ? '—' : r.v + ' cm'}</td>
      <td>${st}</td>
      <td style="font-size:10px;color:#4a6478">${r.v === null ? '保留未知状态' : '阈值分级'}</td>
    </tr>`;
  }).join('');

  showResult(`<table class="dtable">
    <thead><tr><th>路段</th><th>水位</th><th>等级</th><th>处理说明</th></tr></thead>
    <tbody>${rows}</tbody></table>`);

  const danger = results.filter(r => r.level === 'danger').map(r => r.rid);
  const unknown = results.filter(r => r.level === 'unknown').map(r => r.rid);
  state.situation.flood = {
    warnT, dangerT, danger, unknown,
    level: results.map(r => ({ rid: r.rid, level: r.level })),
    at: new Date().toLocaleTimeString('zh-CN', { hour12: false })
  };
  DC.save(state);
  DC.addEvidence(3, '积水研判',
    `警告 ${warnT}cm / 危险 ${dangerT}cm · 危险路段 [${danger.join(',') || '无'}] · 缺测保留未知 [${unknown.join(',') || '无'}]`);
  DC.toast('积水研判完成：' + (danger.length || 0) + ' 条危险路段', 'ok');
  renderTasks();
});

/* ---------- 页面导航 ---------- */
document.getElementById('btnNext').addEventListener('click', () => {
  state.situation.done = true;
  state.stage = Math.max(state.stage, 3);
  DC.save(state);
  DC.addEvidence(3, '完成阶段', '三项态势研判任务完成，生成实验报告');
  location.href = 'report.html';
});
document.getElementById('btnBack').addEventListener('click', () => location.href = 'fusion.html');
</script>
</body>
</html>
