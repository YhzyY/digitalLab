<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>阶段四 · 实验报告与证据链</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">
  <div id="header-host"></div>
  <div class="main">
    <div class="report-scroll">
      <div class="report-inner">

        <!-- 报告头 -->
        <div class="rp-title">孪生城市多源数据融合与智能态势感知 · 实验报告</div>
        <div class="rp-meta" id="rpMeta">—</div>

        <!-- 学生信息 -->
        <div class="rp-section">
          <h3>学生信息</h3>
          <div class="rp-grid">
            <div class="rp-stat">
              <div class="k">姓名</div>
              <input type="text" id="stuName" placeholder="请输入姓名"
                     style="width:100%;background:transparent;border:none;border-bottom:1px solid rgba(0,212,255,.3);
                            color:#00d4ff;font-size:18px;font-family:var(--mono);outline:none;padding:4px 0">
            </div>
            <div class="rp-stat">
              <div class="k">学号</div>
              <input type="text" id="stuSid" placeholder="请输入学号"
                     style="width:100%;background:transparent;border:none;border-bottom:1px solid rgba(0,212,255,.3);
                            color:#00d4ff;font-size:18px;font-family:var(--mono);outline:none;padding:4px 0">
            </div>
            <div class="rp-stat">
              <div class="k">班级</div>
              <input type="text" id="stuCls" placeholder="请输入班级"
                     style="width:100%;background:transparent;border:none;border-bottom:1px solid rgba(0,212,255,.3);
                            color:#00d4ff;font-size:18px;font-family:var(--mono);outline:none;padding:4px 0">
            </div>
            <div class="rp-stat">
              <div class="k">实验开始时间</div>
              <div class="v" style="font-size:13px" id="rpStart">—</div>
            </div>
          </div>
        </div>

        <!-- 阶段完成情况 -->
        <div class="rp-section">
          <h3>阶段完成情况</h3>
          <div class="rp-grid" id="stageGrid"></div>
        </div>

        <!-- 数据融合结果 -->
        <div class="rp-section">
          <h3>多源数据融合结果</h3>
          <div id="fusionSummary"></div>
        </div>

        <!-- 态势研判结果 -->
        <div class="rp-section">
          <h3>智能态势研判结果</h3>
          <div id="situationSummary"></div>
        </div>

        <!-- 能力评价雷达 -->
        <div class="rp-section">
          <h3>能力评价</h3>
          <div class="radar-wrap">
            <canvas id="radar" width="320" height="320"></canvas>
            <div class="radar-legend" id="radarLegend"></div>
          </div>
        </div>

        <!-- 证据链 -->
        <div class="rp-section">
          <h3>操作与证据链</h3>
          <div class="timeline" id="timeline"></div>
        </div>

        <!-- 操作按钮 -->
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin:8px 0 48px">
          <button class="btn btn-primary" id="btnPrint">导出 / 打印报告</button>
          <button class="btn btn-ghost" id="btnPrev">← 返回态势感知</button>
          <button class="btn btn-ghost" id="btnHome">返回首页</button>
          <button class="btn btn-danger" id="btnReset">重置实验</button>
        </div>
      </div>
    </div>
  </div>
  <div class="statusbar">
    <span class="live">REPORT GENERATED</span>
    <span id="statText">—</span>
  </div>
</div>

<script src="assets/common.js"></script>
<script>
renderHeader(4);

const state = DC.load();

/* ---------- 基本信息 ---------- */
document.getElementById('rpMeta').textContent =
  `DIGITAL TWIN CITY · EXPERIMENT REPORT · 生成于 ${new Date().toLocaleString('zh-CN')}`;
document.getElementById('rpStart').textContent = state.startedAt || '未记录';

/* 学生信息回填 */
['name', 'sid', 'cls'].forEach(k => {
  const el = document.getElementById('stu' + k.charAt(0).toUpperCase() + k.slice(1));
  el.value = state.student[k] || '';
  el.addEventListener('input', () => {
    const s = DC.load();
    s.student[k] = el.value;
    DC.save(s);
  });
});

/* ---------- 阶段完成情况 ---------- */
const stageData = [
  { name: '阶段一 · 城市场景搭建', done: state.scene.done,
    detail: `建筑 ${state.scene.buildings.length} 栋 · 设施 ${state.scene.sensors.length} 个 · 关联 ${state.scene.links.length} 条` },
  { name: '阶段二 · 多源数据融合', done: state.fusion.done,
    detail: `数据源 ${state.fusion.sources.length} 个 · 质量阈值 Q${state.fusion.minQuality} · 时间窗 ${state.fusion.window}min` },
  { name: '阶段三 · 智能态势感知', done: state.situation.done,
    detail: `火警 ${state.situation.fire ? '✓' : '—'} · 拥堵 ${state.situation.traffic ? '✓' : '—'} · 积水 ${state.situation.flood ? '✓' : '—'}` }
];

document.getElementById('stageGrid').innerHTML = stageData.map(s => `
  <div class="rp-stat">
    <div class="k">${s.name}</div>
    <div style="font-size:15px;font-family:var(--mono);color:${s.done ? '#00ffa3' : '#4a6478'};margin-bottom:4px">
      ${s.done ? '已完成' : '未完成'}
    </div>
    <div style="font-size:11.5px;color:#7a94ad;line-height:1.6">${s.detail}</div>
  </div>
`).join('');

/* ---------- 融合结果 ---------- */
(function renderFusion(){
  const res = state.fusion.results;
  const host = document.getElementById('fusionSummary');
  if(!res || !res.length){
    host.innerHTML = '<div class="hint" style="margin:0">尚未完成多源数据融合计算。</div>';
    return;
  }
  const rows = res.map(r => {
    const st = r.status === 'congested' ? '<span class="bad">拥堵</span>'
             : r.status === 'slow' ? '<span class="warn">缓行</span>'
             : r.status === 'unknown' ? '<span style="color:#4a6478">未知</span>'
             : '<span class="ok">畅通</span>';
    return `<tr>
      <td>${r.rid}</td>
      <td>${r.speed ?? '—'}</td>
      <td>${r.flow ?? '—'}</td>
      <td>Q${r.quality}</td>
      <td>${st}</td>
      <td style="font-size:10px;color:#4a6478">${r.sources.join(',') || '—'}</td>
    </tr>`;
  }).join('');
  host.innerHTML = `
    <table class="dtable">
      <thead><tr><th>路段</th><th>车速 km/h</th><th>流量 veh/min</th><th>数据质量</th><th>判定状态</th><th>参与来源</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="hint" style="margin-top:12px">
      融合规则：时间窗 ${state.fusion.window} 分钟 · 空间匹配 ${state.fusion.align === 'nearest' ? '最近邻' : '区域聚合'} ·
      质量阈值 Q${state.fusion.minQuality}；低于阈值的数据源被剔除，来源与质量标记随结果保存。
    </div>`;
})();

/* ---------- 态势研判结果 ---------- */
(function renderSituation(){
  const s = state.situation;
  const host = document.getElementById('situationSummary');
  const parts = [];

  if(s.fire){
    parts.push(`
      <div style="margin-bottom:16px">
        <div class="block-title" style="margin-bottom:8px">A · 建筑火警</div>
        <div class="hint" style="margin:0">
          参与数据源：${s.fire.sources.join(' / ')} · 烟感阈值 ${s.fire.smokeT} ppm · 温感阈值 ${s.fire.tempT} ℃<br>
          告警建筑：<b style="color:${s.fire.alarms.length ? '#ff4d6d' : '#00ffa3'}">${s.fire.alarms.join('、') || '无'}</b>
          · 判定时间 ${s.fire.at}
        </div>
      </div>`);
  }
  if(s.traffic){
    parts.push(`
      <div style="margin-bottom:16px">
        <div class="block-title" style="margin-bottom:8px">B · 交通拥堵</div>
        <div class="hint" style="margin:0">
          拥堵车速阈值 ${s.traffic.speedT} km/h<br>
          拥堵路段：<b style="color:${s.traffic.congested.length ? '#ff4d6d' : '#00ffa3'}">${s.traffic.congested.join('、') || '无'}</b>
          · 判定时间 ${s.traffic.at}
        </div>
      </div>`);
  }
  if(s.flood){
    parts.push(`
      <div style="margin-bottom:4px">
        <div class="block-title" style="margin-bottom:8px">C · 道路积水</div>
        <div class="hint" style="margin:0">
          警告水位 ${s.flood.warnT} cm · 危险水位 ${s.flood.dangerT} cm<br>
          危险路段：<b style="color:${s.flood.danger.length ? '#ff4d6d' : '#00ffa3'}">${s.flood.danger.join('、') || '无'}</b>
          · 缺测保留未知：<b style="color:#ffb800">${s.flood.unknown.join('、') || '无'}</b>
          · 判定时间 ${s.flood.at}
        </div>
      </div>`);
  }

  host.innerHTML = parts.length ? parts.join('')
    : '<div class="hint" style="margin:0">尚未完成态势研判任务。</div>';
})();

/* ---------- 能力雷达 ---------- */
(function renderRadar(){
  const cv = document.getElementById('radar');
  const ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const SIZE = 320;
  cv.width = SIZE * dpr;
  cv.height = SIZE * dpr;
  cv.style.width = SIZE + 'px';
  cv.style.height = SIZE + 'px';
  ctx.scale(dpr, dpr);

  const axes = ['对象建模', '数据融合', '态势感知', '证据追溯', '工程判断'];
  const s = state;
  const sceneScore = Math.min(100,
    (s.scene.buildings.length / 3) * 35 + (s.scene.sensors.length / 2) * 35 + (s.scene.links.length / 2) * 30);
  const fusionScore = s.fusion.done ? Math.min(100, 60 + s.fusion.sources.length * 8) : (s.fusion.results ? 45 : 10);
  const situScore = (s.situation.fire ? 34 : 0) + (s.situation.traffic ? 33 : 0) + (s.situation.flood ? 33 : 0);
  const evCount = s.evidence.length;
  const evScore = Math.min(100, evCount * 9);
  const judgeScore = s.situation.done ? Math.min(100, 55 + (s.situation.flood && s.situation.flood.unknown.length ? 20 : 10) + 15) : Math.round(situScore * 0.6);
  const values = [sceneScore, fusionScore, situScore, evScore, judgeScore].map(v => Math.max(5, Math.min(100, Math.round(v))));

  const cx = SIZE / 2, cy = SIZE / 2 + 6, R = 108, N = axes.length;

  /* 网格 */
  for(let ring = 1; ring <= 4; ring++){
    ctx.beginPath();
    for(let i = 0; i <= N; i++){
      const a = (Math.PI * 2 * i) / N - Math.PI / 2;
      const r = (R * ring) / 4;
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = 'rgba(0,212,255,' + (0.08 + ring * 0.03) + ')';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  /* 轴线 + 标签 */
  axes.forEach((name, i) => {
    const a = (Math.PI * 2 * i) / N - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
    ctx.strokeStyle = 'rgba(0,212,255,.16)';
    ctx.stroke();

    const lx = cx + Math.cos(a) * (R + 26);
    const ly = cy + Math.sin(a) * (R + 26);
    ctx.fillStyle = '#7a94ad';
    ctx.font = '12px -apple-system,"PingFang SC",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(name, lx, ly);
  });
  /* 数据面 */
  ctx.beginPath();
  values.forEach((v, i) => {
    const a = (Math.PI * 2 * i) / N - Math.PI / 2;
    const r = (R * v) / 100;
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.closePath();
  ctx.fillStyle = 'rgba(0,212,255,.18)';
  ctx.fill();
  ctx.strokeStyle = '#00d4ff';
  ctx.lineWidth = 2;
  ctx.stroke();

  /* 顶点 */
  values.forEach((v, i) => {
    const a = (Math.PI * 2 * i) / N - Math.PI / 2;
    const r = (R * v) / 100;
    ctx.beginPath();
    ctx.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 3.2, 0, Math.PI * 2);
    ctx.fillStyle = '#00ffa3';
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#00ffa3';
    ctx.fill();
    ctx.shadowBlur = 0;
  });

  document.getElementById('radarLegend').innerHTML = axes.map((name, i) =>
    `${name} &nbsp;<b>${values[i]}</b>`).join('<br>') +
    `<br><span style="color:#4a6478;font-size:11px">总分 ${Math.round(values.reduce((a,b)=>a+b,0)/values.length)}</span>`;

  document.getElementById('statText').textContent =
    `综合得分 ${Math.round(values.reduce((a, b) => a + b, 0) / values.length)} / 100`;
})();

/* ---------- 证据链 ---------- */
(function renderTimeline(){
  const host = document.getElementById('timeline');
  const ev = state.evidence.slice();
  if(!ev.length){
    host.innerHTML = '<div class="hint" style="margin:0">暂无操作记录。</div>';
    return;
  }
  host.innerHTML = ev.map(e => `
    <div class="tl-item">
      <span class="tl-t">${e.t}</span>
      <span class="tl-a">${e.action}</span>
      <div class="tl-d">${e.detail}</div>
    </div>
  `).join('');
})();

/* ---------- 按钮 ---------- */
document.getElementById('btnPrint').addEventListener('click', () => {
  const s = DC.load();
  s.situation.done = true;
  s.stage = 4;
  DC.save(s);
  DC.addEvidence(4, '导出报告', '生成并打印实验报告');
  window.print();
});

document.getElementById('btnPrev').addEventListener('click', () => location.href = 'situation.html');
document.getElementById('btnHome').addEventListener('click', () => location.href = 'index.html');
document.getElementById('btnReset').addEventListener('click', () => {
  if(confirm('确定要清空全部实验数据吗？此操作不可撤销。')){
    DC.reset();
    location.href = 'index.html';
  }
});
</script>
</body>
</html>
